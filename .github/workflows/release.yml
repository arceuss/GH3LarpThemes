name: Publish themes

# every push that changes a theme makes a new release with one zip per theme folder.
# /releases/latest/download/<Theme>.zip always points at the newest one.
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '*.md'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick the release tag
        run: echo "TAG=themes-$(date -u +%Y.%m.%d)-${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Zip each theme
        env:
          DOWNLOAD_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.TAG }}
        run: bash .github/scripts/package.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/*.zip \
            --target "${{ github.sha }}" \
            --title "Themes $(date -u +%Y-%m-%d) (#${{ github.run_number }})" \
            --notes-file dist/notes.md \
            --latest
