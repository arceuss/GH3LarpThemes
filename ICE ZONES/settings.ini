[sustain_fx]
; Vertical pivot offset in pixels for FX/sustain_hold.png.
; Negative moves the pivot up, which moves the rendered spark up.
; -9 matches the GH3 sustain_hold alignment, For WoRMod zones use 6.
pivot_y_offset_pixels=6

[profiling]
; Diagnostic only. Set enabled=false after capturing stutter logs.
enabled=false
interval_seconds=2

[presentation]
hud_style=wormod
flame_style=wormod
; gh3 fits the field height to CH's far limit. wormod keeps the 1280x720 aspect
; from the fret span, which is what the GH3PC WoRMod capture shows.
highway_projection=wormod